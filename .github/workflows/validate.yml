# Validates the marketplace catalog and every plugin on each PR into main,
# so schema errors in marketplace.json / plugin.json / SKILL.md are caught
# before merge.
name: Validate

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugins
        run: claude plugin validate .

      - name: Enforce skill naming convention (hrm-/phx- prefix, kebab-case)
        run: |
          set -euo pipefail
          fail=0
          for dir in plugins/*/skills/*/; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            if [[ "$name" == "hrm_deployment_script" || "$name" == "phx_debugger" || "$name" == "sql_standards_review" ]]; then
              continue # grandfathered — predate the naming rule
            fi
            if ! [[ "$name" =~ ^(hrm|phx)-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
              echo "::error::Skill '$name' violates naming rule: must start with 'hrm-' or 'phx-' and be kebab-case (e.g. hrm-my-skill)."
              fail=1
            fi
          done
          exit $fail
