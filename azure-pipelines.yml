# Validates the marketplace catalog and every plugin on each PR into main,
# so schema errors in marketplace.json / plugin.json / SKILL.md are caught
# before merge. Mirrors what `.github/workflows/validate.yml` did on GitHub.
trigger: none            # don't run on branch pushes; PR validation only

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: "20.x"
    displayName: Set up Node.js 20

  - script: npm install -g @anthropic-ai/claude-code
    displayName: Install Claude Code CLI

  - script: claude plugin validate .
    displayName: Validate marketplace and plugins
